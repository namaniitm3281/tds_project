services:
  - type: web
    name: tds-data-agent-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AIPIPE_TOKEN
        sync: false
      - key: AIPIPE_BASE_URL
        sync: false
      - key: AIPIPE_MODEL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
